[package]
name = "swoosh"
version = "0.4.2"
edition = "2024"
rust-version = "1.96"
description = "Library to send text messages"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
tokio = { version = "1.52.3", features = ["full"] }
futures = { version = "0.3.32" }
http = { version = "1.4.2" }
reqwest = { version = "0.13.4", features = ["form", "json", "blocking", "multipart", "stream"] }
rand = { version = "0.10.1" }
time = { version = "0.3.49", features = ["formatting", "macros", "parsing", "serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
base64-ng = { version = "1.0.8" }
const_format = { version = "0.2.36" }
josekit = { version = "0.10.3" }
textsender_models = { git = "ssh://git@git.kundeng.us/phoenix/textsender_models.git", tag = "v0.4.3-29-720f3d8f75-111", features = ["config", "contact", "message"] }

[dev-dependencies]
tempfile = { version = "3.27.0" }
