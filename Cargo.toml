[package]
name = "swoosh"
version = "0.5.5"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Library to send text messages"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
reqwest = { version = "0.13.5", features = ["form", "json", "blocking", "multipart", "stream"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
base64-ng = { version = "2.1.1" }
schedtxt_models = { git = "ssh://git@git.kundeng.us/phoenix/schedtxt_models.git", tag = "v0.5.4", features = ["config", "contact", "message"], optional = true }

[dev-dependencies]

[features]
default = ["full"]
slim = ["send_message", "networking"]
full = ["networking", "schedtxt_models", "send_message", "twilio", "url", "util"]
networking = ["schedulable", "url", "util"]
schedtxt_models = ["dep:schedtxt_models"]
schedulable = []
send_message = ["networking", "url"]
twilio = ["schedtxt_models", "url"]
util = []
url = []
