[package]
name = "swoosh"
version = "0.5.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Library to send text messages"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
reqwest = { version = "0.13.5", features = ["form", "json", "blocking", "multipart", "stream"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
base64-ng = { version = "2.1.1" }
schedtxt_models = { git = "ssh://git@git.kundeng.us/phoenix/schedtxt_models.git", tag = "v0.5.4", features = ["config", "contact", "message"] }

[dev-dependencies]
